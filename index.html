<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#111418">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #1c1f24; --muted: #7a7f87;
    --accent: #2f6fed; --shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1d2127; --ink: #eef0f3; --muted: #8b929c;
            --accent: #6b9bff; --shadow: 0 10px 30px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  body { display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  header { display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  header button { background: none; border: 0; color: var(--accent); font-size: 15px; padding: 8px 0; }
  header .right { display: flex; gap: 16px; }
  #mode.on { font-weight: 600; }
  .bar { height: 3px; background: color-mix(in srgb, var(--muted) 25%, transparent);
    border-radius: 2px; margin: 8px 0 16px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  #card { flex: 1; background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; cursor: pointer; position: relative; }
  #fav { position: absolute; top: 8px; right: 8px; background: none; border: 0;
    font-size: 30px; line-height: 1; padding: 12px; color: var(--muted); cursor: pointer; }
  #fav.on { color: #f5b301; }
  #word { font-size: clamp(36px, 11vw, 56px); font-weight: 700; letter-spacing: -.5px;
    word-break: break-word; }
  #trans { margin-top: 20px; font-size: clamp(22px, 6.5vw, 30px); color: var(--accent);
    min-height: 1.3em; opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; }
  #card.shown #trans { opacity: 1; transform: none; }
  #hint { margin-top: 28px; color: var(--muted); font-size: 14px; }
  footer { display: flex; gap: 12px; margin-top: 16px; }
  footer button { flex: 1; border: 0; border-radius: 16px; padding: 16px; font-size: 17px;
    font-weight: 600; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  footer button.primary { background: var(--accent); color: #fff; flex: 2; }
</style>
</head>
<body>
  <header>
    <span id="count">…</span>
    <div class="right">
      <button id="mode">★ Favoritas</button>
      <button id="reset">Embaralhar</button>
    </div>
  </header>
  <div class="bar"><div id="progress"></div></div>

  <main id="card">
    <button id="fav" aria-label="Favoritar">☆</button>
    <div id="word">carregando…</div>
    <div id="trans"></div>
    <div id="hint">toque para ver a tradução</div>
  </main>

  <footer>
    <button id="back">Voltar</button>
    <button id="next" class="primary">Mostrar</button>
  </footer>

<script>
const KEY = 'flashcards-v1', FAVS_KEY = 'flashcards-favs', FAV_DECK_KEY = 'flashcards-favdeck', MODE_KEY = 'flashcards-mode';
let words = [], state = { order: [], pos: 0 }, favDeck = { order: [], pos: 0 }, shown = false;
let favs = new Set(), mode = 'all';

const $ = id => document.getElementById(id);
const deck = () => mode === 'fav' ? favDeck : state;
const isFav = i => favs.has(words[i][0]);
const favIndexes = () => words.map((_, i) => i).filter(isFav);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const range = n => Array.from({ length: n }, (_, i) => i);

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    localStorage.setItem(FAV_DECK_KEY, JSON.stringify(favDeck));
    localStorage.setItem(FAVS_KEY, JSON.stringify([...favs]));
    localStorage.setItem(MODE_KEY, mode);
  } catch {}
}

function read(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }

function load() {
  const s = read(KEY);
  if (s && s.order && s.order.length === words.length) state = s;
  else state = { order: shuffle(range(words.length)), pos: 0 };
  favs = new Set(read(FAVS_KEY) || []);
  const f = read(FAV_DECK_KEY);
  if (f && f.order) favDeck = f;
  try { mode = localStorage.getItem(MODE_KEY) === 'fav' ? 'fav' : 'all'; } catch {}
  if (mode === 'fav') enterFav(); else save();
}

// Resume the favorites deck if it still has the same words; rebuild it if favorites changed.
function enterFav() {
  const idx = favIndexes();
  if (!idx.length) { mode = 'all'; save(); return false; }
  const same = favDeck.order.length === idx.length && favDeck.order.every(isFav) && favDeck.pos < idx.length;
  if (!same) favDeck = { order: shuffle(idx), pos: 0 };
  mode = 'fav'; save(); return true;
}

function render() {
  const d = deck(), i = d.order[d.pos];
  const [en, pt] = words[i];
  $('word').textContent = en;
  $('trans').textContent = pt;
  $('card').classList.toggle('shown', shown);
  $('hint').style.visibility = shown ? 'hidden' : 'visible';
  $('next').textContent = shown ? 'Próxima' : 'Mostrar';
  $('count').textContent = `${mode === 'fav' ? '★ ' : ''}${d.pos + 1} / ${d.order.length}`;
  $('progress').style.width = `${(d.pos + 1) / d.order.length * 100}%`;
  $('fav').textContent = isFav(i) ? '★' : '☆';
  $('fav').classList.toggle('on', isFav(i));
  $('mode').textContent = mode === 'fav' ? 'Todas' : `★ Favoritas (${favs.size})`;
  $('mode').classList.toggle('on', mode === 'fav');
}

function advance() {
  if (!shown) { shown = true; return render(); }
  const d = deck();
  // In favorites mode, a card unstarred on the way drops out of the deck.
  if (mode === 'fav' && !isFav(d.order[d.pos])) d.order.splice(d.pos, 1);
  else d.pos++;
  if (!d.order.length) { mode = 'all'; alert('Sem favoritas. Voltando para todas as palavras.'); }
  else if (d.pos >= d.order.length) {
    d.pos = 0;
    d.order = mode === 'fav' ? shuffle(favIndexes()) : shuffle(range(words.length));
  }
  shown = false; save(); render();
}

function back() {
  const d = deck();
  if (d.pos === 0) return;
  d.pos--; shown = true; save(); render();
}

function toggleFav(e) {
  e.stopPropagation();
  const d = deck(), en = words[d.order[d.pos]][0];
  if (favs.has(en)) favs.delete(en); else favs.add(en);
  save(); render();
}

$('card').addEventListener('click', advance);
$('fav').addEventListener('click', toggleFav);
$('next').addEventListener('click', advance);
$('back').addEventListener('click', back);
$('mode').addEventListener('click', () => {
  if (mode === 'fav') mode = 'all';
  else if (!enterFav()) return alert('Toque na ☆ de uma palavra para salvá-la nas favoritas.');
  shown = false; save(); render();
});
$('reset').addEventListener('click', () => {
  if (!confirm('Embaralhar de novo e começar do zero?')) return;
  if (mode === 'fav') favDeck = { order: shuffle(favIndexes()), pos: 0 };
  else state = { order: shuffle(range(words.length)), pos: 0 };
  shown = false; save(); render();
});

fetch('words.json').then(r => r.json()).then(w => { words = w; load(); render(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
